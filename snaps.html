<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Snaps by nubsuki: candid moments, photography, and quick frames of life." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/loading.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/snaps.css" />
    <link rel="stylesheet" href="css/terminal.css" />
    <link rel="icon" type="image/jpeg" href="assets/bochchi.jpg" />
    <title>nubsuki.exe // snaps</title>
</head>

<body>
    <!-- Loading Screen Overlay -->
    <section id="loading-screen"></section>

    <!-- Main Navbar Container -->
    <section id="navbar-placeholder"></section>

    <main class="snaps-container">
        <!-- Header Box -->
        <section class="content-box snaps-header-box">
            <div class="snaps-header-top">
                <h2><i class="bi bi-camera-fill"></i> SNAPS</h2>
                <div class="snaps-count-badge">
                    <i class="bi bi-images"></i> <span id="snaps-count-num">0</span> Snaps
                </div>
            </div>
            <p class="snaps-hero-sub">
                Moments captured.
            </p>

            <!-- Snaps Grid -->
            <div class="snaps-grid" id="snaps-grid">
                <!-- Rendered dynamically by js/snaps.js -->
            </div>
        </section>
    </main>

    <!-- Lightbox Modal -->
    <div class="snaps-lightbox" id="snaps-lightbox" aria-hidden="true">
        <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
        <div class="lightbox-dialog">
            <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close image">
                <i class="bi bi-x-lg"></i>
            </button>

            <button type="button" class="lightbox-nav prev" id="lightbox-prev" aria-label="Previous image">
                <i class="bi bi-chevron-left"></i>
            </button>

            <div class="lightbox-content">
                <img id="lightbox-img" src="" alt="" />
                <div class="lightbox-meta">
                    <div class="lightbox-title-wrap">
                        <span class="lightbox-caption" id="lightbox-caption"></span>
                        <span class="lightbox-date" id="lightbox-date"></span>
                    </div>
                    <a id="lightbox-raw-link" href="" target="_blank" class="lightbox-raw-btn"
                        title="Open full resolution in new tab">
                        <i class="bi bi-box-arrow-up-right"></i> Raw
                    </a>
                </div>
            </div>

            <button type="button" class="lightbox-nav next" id="lightbox-next" aria-label="Next image">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </div>

    <script src="js/miyabi.js"></script>
    <script src="js/discord.js"></script>
    <script src="js/index.js"></script>
    <script src="js/snaps.js"></script>
    <script src="js/terminal.js"></script>
</body>

</html>
